# The PR gate. Runs the same steps as `npm run predeploy` — the Rust FFI crate over the pinned
# core, and the C# shell — so a green run here means what a green local run means. The core's own
# gate, and the cross-platform contract check against astrid-web, run in
# https://github.com/Graceful-Tools/astrid-core; what this repo pins is a revision that passed.
#
# ARM64 is a shipping architecture, so it is cross-built on every push and, where a native ARM
# runner is available, tested natively too. A dependency that cannot target ARM64 is caught the day
# it lands rather than the week of a release.
#
# The shell has its own job. It used to have none, which left 6,800 lines of C# and 200-odd tests
# outside the gate: a compile break in the shell landed on `main` green, and the only thing that
# would have said otherwise was somebody's local predeploy.
#
# One job here is NOT in `npm run predeploy`, and deliberately: `supply-chain` asks the RustSec
# advisory database about this repo's lockfile, which needs the network and a tool nobody has
# installed locally. It is also the only job that runs on a schedule, since it is the only one whose
# answer can change while the repository does not.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory is published between commits, so a push-only gate learns about it on whatever day
  # someone happens to touch the repo. astrid-web learned this on AWTD-914 and runs its npm audit
  # weekly for the same reason. Monday 06:00 UTC, before the Dependabot PRs land.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The supply chain ──────────────────────────────────────────────────────────────────────────
  # `cargo deny` over THIS repo's lockfile: advisories, licences, wildcard requirements and where
  # the crates came from. The ffi crate pins the core by revision but resolves its own tree, so this
  # is a real gate of its own and not a restatement of astrid-core's. The rules are in `deny.toml`
  # at the root, which says why each licence in the allow list is there and why the core's git URL
  # is the one `allow-git` entry.
  #
  # Not part of `npm run predeploy`: the check needs the advisory database, which means the network,
  # and cargo-deny is not installed on the dev machines.
  #
  # Two invocations rather than one, because the two halves fail for unrelated reasons and a single
  # red job would not say which: `advisories` goes red when the WORLD changed (an advisory was
  # published against a version this repo already pinned), `licenses bans sources` when THIS REPO
  # changed (a new dependency arrived with a licence or from a place nobody has accepted). Both
  # block — a gate that cannot fail is documentation.
  #
  # ubuntu, though nothing here ships for Linux: cargo-deny reads the lockfile and the advisory
  # database, never the compiler, so the host is irrelevant and the cheap runner is the right one.
  supply-chain:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - licenses bans sources
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  core:
    name: ffi over the pinned core (${{ matrix.name }})
    # The weekly tick exists to ask the advisory database a question, not to rebuild the crate and
    # the shell. fmt, clippy, the tests and the cross-build answer to a commit, so they run when
    # there is one.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # Native ARM64 runners are still rolling out. The job is allowed to be skipped rather
          # than to fail the gate; the cross-build below always runs, so ARM64 is never unchecked.
          - name: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    continue-on-error: ${{ matrix.name == 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      # The toolchain, its components and both targets come from rust-toolchain.toml, so there is
      # one place that decides which Rust this repo builds with.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  cross-build:
    name: ARM64 cross-build
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-arm64
      - run: cargo build --workspace --target aarch64-pc-windows-msvc

  shell:
    name: shell (build + tests)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: shell
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The shell carries the core's DLL and refuses to build without the one for its
      # architecture (ASTRID001 in Astrid.Core.Bindings.csproj), so both are built first — the
      # same order scripts/predeploy.ps1 uses, and for the same reason: a shell built against a
      # stale core is a build that passes and an app that does not run.
      - name: Build the core for both architectures
        run: |
          cargo build -p astrid-ffi --target x86_64-pc-windows-msvc
          cargo build -p astrid-ffi --target aarch64-pc-windows-msvc

      # Per project with a RID, not per solution: a solution cannot be built with a
      # RuntimeIdentifier, and `-p:Platform=x64` is silently ignored by a WinUI SDK project.
      - name: Build the shell (x64)
        run: dotnet build app/Astrid.App/Astrid.App.csproj -c Release -r win-x64 --self-contained false
      - name: Build the shell (ARM64)
        run: dotnet build app/Astrid.App/Astrid.App.csproj -c Release -r win-arm64 --self-contained false

      # The view-model tests and the C#-to-Rust boundary tests. Plain net9.0, run as the host.
      # The UI smoke tests are not in the solution: they need a desktop session.
      - name: Shell tests
        run: dotnet test app/Astrid.sln -c Release
