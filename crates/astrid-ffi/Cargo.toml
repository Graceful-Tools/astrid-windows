[package]
name = "astrid-ffi"
description = "The C ABI the WinUI shell calls astrid-core through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the shell to load; rlib so the tests here can call the same functions the shell will.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The shared core, by revision. `cargo update -p astrid-core` after changing the rev.
#
# `version` as well as `rev`, and it is not decoration: a git dependency with only a `rev` has NO
# version requirement, cargo reports it as `*`, and `deny.toml` sets `[bans] wildcards = "deny"` —
# so this one line is why CI's `licenses bans sources` job was red. Cargo checks it against the
# pinned checkout's own version at build time, so a pin bump that crosses a major version fails
# here, loudly, instead of changing what shipped with nothing recording it.
#
# `bundled-sqlite` is the core's default and is named here anyway (task `f1210dd8`). It compiles
# SQLite into the binary, which this app has no alternative to — Windows ships no `libsqlite3` for
# an MSVC link to find — while Apple turns it off to link the system copy it already has. Written
# down because a default is someone else's decision to change, and the failure would be a link
# error on both targets rather than anything a test could explain. `supply_chain_contract.rs`
# asserts the resolved graph still carries it.
astrid-core = { git = "https://github.com/Graceful-Tools/astrid-core.git", version = "0.1", rev = "65ad6f05763b33577c0426d812046e1cb6b08ab2", features = ["bundled-sqlite"] }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# DPAPI, for the credential at rest. See `secure_store` for why this rather than PasswordVault.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
