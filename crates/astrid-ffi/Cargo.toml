[package]
name = "astrid-ffi"
description = "The C ABI the WinUI shell calls astrid-core through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the shell to load; rlib so the tests here can call the same functions the shell will.
crate-type = ["cdylib", "rlib"]

[dependencies]
astrid-core = { path = "../astrid-core" }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# DPAPI, for the credential at rest. See `secure_store` for why this rather than PasswordVault.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
