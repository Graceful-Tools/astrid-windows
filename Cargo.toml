# Astrid for Windows — Rust workspace.
#
# The shared core lives in its own repository, https://github.com/Graceful-Tools/astrid-core,
# and is pinned by revision in crates/astrid-ffi/Cargo.toml (extracted 2026-09-26; its history
# went with it). What stays here is `astrid-ffi`: the C ABI the WinUI shell calls the core
# through, and the Windows platform services (DPAPI for the session at rest). Bump the pin
# deliberately, as the contract fixtures are bumped: a core change reaches this app only when
# someone here says so.
#
# See docs/ASTRID.md for the rules that govern what may live where.
[workspace]
resolver = "2"
members = ["crates/astrid-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Graceful-Tools/astrid-windows"

# Only what a member actually takes.
#
# This table used to carry twelve more — the HTTP stack, the SQLite build, the Markdown dialect,
# the PKCE primitives — each with a comment explaining a decision. The decisions were real; they
# just stopped being this repository's when the core was extracted in September 2026, and the
# entries stayed behind describing a graph that no longer existed. A workspace dependency nothing
# instantiates never reaches the lockfile, so nothing went red: it only misled the people and the
# robots that read manifests, and Dependabot opened PR #12 to bump a crate this app never builds.
#
# `no_workspace_dependency_goes_uninstantiated_task_d24777f5` in
# `crates/astrid-ffi/tests/supply_chain_contract.rs` is what keeps the table honest from here. If
# a choice below is ever reversed, the comment explaining it goes where the choice lives — which
# for anything shared is astrid-core.
[workspace.dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
